apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: echoserver
  name: echoserver
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app.kubernetes.io/name: echoserver
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: echoserver
  name: echoserver
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: echoserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echoserver
    spec:
      containers:
        - env:
            - name: PORT
              value: "80"
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          name: echoserver
          ports:
            - containerPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
  labels:
    app.kubernetes.io/name: echoserver
  name: echoserver
spec:
  ingressClassName: nginx
  rules:
    - host: echoserver.test2-dummy.ztst-cicd.localhost
      http:
        paths:
          - backend:
              service:
                name: echoserver
                port:
                  number: 80
            path: /
            pathType: Prefix
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: echoserver
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: echoserver
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause:
            duration: 10
        - setWeight: 60
        - pause:
            duration: 10
        - setWeight: 80
        - pause:
            duration: 10
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: echoserver
    scaleDown: onsuccess
