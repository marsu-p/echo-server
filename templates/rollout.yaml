apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: echoserver
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: echoserver
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: echoserver
    scaleDown: onsuccess
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause: {duration: 10}
        - setWeight: 60
        - pause: {duration: 10}
        - setWeight: 80
        - pause: {duration: 10}
