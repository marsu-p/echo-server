apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echoserver
  template:
    metadata:
      labels:
        app: echoserver
    spec:
      containers:
        - env:
            - name: PORT
              value: "80"
          image: ealen/echo-server:0.8.16
          imagePullPolicy: IfNotPresent
          name: echoserver
          ports:
            - containerPort: 80
